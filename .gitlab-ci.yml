stages:
  - style
  - test
  - build
  - deploy

default:
  image: python:3.10
  before_script:
    - apt-get update && apt-get install -y cmake build-essential git pkg-config ca-certificates wget libomp-dev libeigen3-dev libboost-all-dev uuid-dev libcgal-dev ffmpeg libegl1
    - pip install poetry
    - poetry config virtualenvs.in-project true
    - poetry install --with docs,dev
    - source .venv/bin/activate

variables:
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_SUBMODULE_STRATEGY : recursive

pre_commit:
  stage: style
  before_script:
    - pip install pre-commit
  script:
    - pre-commit run --all-files --show-diff-on-failure

unittest:
  image : python:$PYTHON_VERSIONS
  stage: test
  parallel :
    matrix :
      - PYTHON_VERSIONS : [ "3.9", "3.10", "3.11"]
  script:
    - poetry run python -m unittest discover tests/unittests

dataset_test:
  image : python:$PYTHON_VERSIONS
  stage: test
  parallel :
    matrix :
      - PYTHON_VERSIONS : [ "3.9", "3.10", "3.11"]
  script:
    - python -m unittest discover tests/datasets

